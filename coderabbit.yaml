# .coderabbit.yaml
language: "ko"              # 리뷰 언어 설정 (한국어)
reviews:
  profile: "chill"      # chill | assertive (피드백 강도)
  request_changes_workflow: false
  high_level_summary: true  # PR 요약 활성화
  poem: false               # 리뷰 끝 시 비활성화
  review_status: true

# 특정 경로 제외
path_filters:
  - "!**/*.lock"
  - "!**/migrations/**"
  - "!**/__generated__/**"

# 커스텀 리뷰 지침
#instructions: