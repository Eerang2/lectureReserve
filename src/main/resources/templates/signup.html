<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        .signup-container h2 {
            text-align: center;
            margin-bottom: 32px;
            font-size: 24px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #333;
        }

        .error-message {
            margin-top: 6px;
            font-size: 12px;
            color: #e74c3c;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #555;
        }

        .submit-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .login-link a {
            color: #333;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>회원가입</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="userId">아이디</label>
                <input type="text" id="userId" name="userId" placeholder="아이디를 입력해주세요" required>
                <div class="error-message" id="userIdError"></div>
            </div>
            <div class="form-group">
                <label for="userPw">비밀번호</label>
                <input type="password" id="userPw" name="userPw" placeholder="비밀번호를 입력해주세요 (8자 이상)" required minlength="8">
                <div class="error-message" id="userPwError"></div>
            </div>
            <div class="form-group">
                <label for="userPwConfirm">비밀번호 확인</label>
                <input type="password" id="userPwConfirm" name="userPwConfirm" placeholder="비밀번호를 다시 입력해주세요" required minlength="8">
                <div class="error-message" id="userPwConfirmError"></div>
            </div>
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" placeholder="이름을 입력해주세요" required>
                <div class="error-message" id="nameError"></div>
            </div>
            <button type="submit" class="submit-btn">가입하기</button>
        </form>
        <div class="login-link">
            이미 계정이 있으신가요? <a href="/login">로그인</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const submitBtn = form.querySelector('.submit-btn');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            clearErrors();

            const userId = document.getElementById('userId').value.trim();
            const userPw = document.getElementById('userPw').value;
            const name = document.getElementById('name').value.trim();

            // 클라이언트 유효성 검사
            let hasError = false;

            if (!userId) {
                showError('userIdError', '아이디를 입력해주세요.');
                hasError = true;
            }
            if (!userPw || userPw.length < 8) {
                showError('userPwError', '비밀번호는 8자 이상이어야 합니다.');
                hasError = true;
            }
            const userPwConfirm = document.getElementById('userPwConfirm').value;
            if (userPw !== userPwConfirm) {
                showError('userPwConfirmError', '비밀번호가 일치하지 않습니다.');
                hasError = true;
            }
            if (!name) {
                showError('nameError', '이름을 입력해주세요.');
                hasError = true;
            }

            if (hasError) return;

            submitBtn.disabled = true;
            submitBtn.textContent = '가입 중...';

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, userPw, name })
                });

                if (response.ok) {
                    alert('회원가입이 완료되었습니다.');
                    window.location.href = '/login';
                } else {
                    const errorData = await response.json();
                    alert(errorData.message || '회원가입에 실패했습니다.');
                }
            } catch (error) {
                alert('서버와 통신 중 오류가 발생했습니다.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '가입하기';
            }
        });

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
                el.style.display = 'none';
            });
        }
    </script>
</body>
</html>
